<div class="panel panel-default">
	<div class="panel-heading">
		<h3 class="panel-title">{{ isNew ? 'Add Contact' : 'Edit Contact' }}</h3>
	</div>
	<div class="panel-body">
		<div class="form-group">
			<label for="name">Name</label>
			<input id="name" type="text" class="form-control" [(ngModel)]="currentContact.name" />
		</div>
		<div class="form-group">
			<label for="email">Email</label>
			<input id="email" type="email" class="form-control" [(ngModel)]="currentContact.email" />
		</div>
		<div class="form-group">
			<label for="phone">Phone</label>
			<input id="phone" type="text" class="form-control" [(ngModel)]="currentContact.phone" />
		</div>
		<div class="form-group">
			<label for="imageUrl">Image URL</label>
			<input id="imageUrl" type="text" class="form-control" [(ngModel)]="currentContact.imageUrl" />
		</div>
		<button class="btn btn-primary" type="button" (click)="onSave()">Save</button>
		<button class="btn btn-default" type="button" (click)="onClear()">Clear</button>
		<a class="btn btn-link" routerLink="/contacts">Cancel</a>
	</div>
</div>
