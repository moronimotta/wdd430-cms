<div class="panel panel-default">
  <div class="panel-heading clearfix">
    <h3 class="panel-title pull-left">Contacts</h3>
    <a class="btn btn-success btn-sm pull-right" href="#">New Contact</a>
  </div>
  <div class="panel-body">
    <div class="list-group">
      <cms-contact-item *ngFor="let contact of contacts" [contact]="contact" (click)="onSelected(contact)"></cms-contact-item>
    </div>
  </div>
</div>
