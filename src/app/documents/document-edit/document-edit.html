<div class="panel panel-default">
	<div class="panel-heading">
		<h3 class="panel-title">{{ isNew ? 'Add Document' : 'Edit Document' }}</h3>
	</div>
	<div class="panel-body">
		<div class="form-group">
			<label for="name">Name</label>
			<input id="name" type="text" class="form-control" [(ngModel)]="currentDocument.name" />
		</div>
		<div class="form-group">
			<label for="description">Description</label>
			<textarea id="description" class="form-control" rows="3" [(ngModel)]="currentDocument.description"></textarea>
		</div>
		<div class="form-group">
			<label for="url">URL</label>
			<input id="url" type="text" class="form-control" [(ngModel)]="currentDocument.url" />
		</div>
		<button class="btn btn-primary" type="button" (click)="onSave()">Save</button>
		<button class="btn btn-default" type="button" (click)="onClear()">Clear</button>
		<a class="btn btn-link" routerLink="/documents">Cancel</a>
	</div>
</div>
