<div class="panel panel-default">
	<div class="panel-heading">
		<h3 class="panel-title">Add Message</h3>
	</div>
	<div class="panel-body">
		<div class="form-group">
			<label for="subject">Subject</label>
			<input id="subject" #subject type="text" class="form-control" />
		</div>
		<div class="form-group">
			<label for="sender">Sender</label>
			<select id="sender" #sender class="form-control" [value]="currentSender">
				<option *ngFor="let contact of contacts" [value]="contact._id || contact.id">{{ contact.name }}</option>
			</select>
		</div>
		<div class="form-group">
			<label for="msgText">Message</label>
			<textarea id="msgText" #msgText class="form-control" rows="3"></textarea>
		</div>
		<button class="btn btn-primary" type="button" (click)="onSendMessage()">Send</button>
		<button class="btn btn-default" type="button" (click)="onClear()">Clear</button>
	</div>
</div>
